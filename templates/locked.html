<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Almost Time ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(220, 45, 115, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(150, 30, 100, 0.12),
                    transparent 30%
                ),
                #09070b;

            color: white;

            font-family: Arial, sans-serif;

            overflow-x: hidden;
        }

        /* BACKGROUND */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            z-index: 0;
        }

        .glow {

            position: absolute;

            width: 400px;

            height: 400px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.16;

            animation:
                float 10s ease-in-out infinite alternate;
        }

        .glow.one {

            background: #e52d73;

            top: -180px;

            left: -150px;
        }

        .glow.two {

            background: #8e174f;

            bottom: -180px;

            right: -150px;

            animation-delay: 3s;
        }

        @keyframes float {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(70px, 50px);
            }

        }

        /* MAIN */

        .container {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 540px;

            padding:
                45px 30px;

            border-radius: 28px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.08),
                    rgba(255,255,255,0.025)
                );

            border:
                1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.55);

            backdrop-filter:
                blur(20px);

            animation:
                appear 1.2s ease forwards;
        }

        /* HEART */

        .heart {

            width: 82px;

            height: 82px;

            margin:
                0 auto 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #f04d8a,
                    #8d174b
                );

            font-size: 32px;

            box-shadow:
                0 0 45px
                rgba(240,77,138,0.30);

            animation:
                heartbeat 2s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            10% {
                transform: scale(1.08);
            }

            20% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.08);
            }

            40% {
                transform: scale(1);
            }

        }

        /* LABEL */

        .eyebrow {

            color: #e6a7bf;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 18px;
        }

        /* TITLE */

        h1 {

            font-family: Georgia, serif;

            font-size:
                clamp(
                    32px,
                    8vw,
                    48px
                );

            line-height: 1.1;

            margin-bottom: 18px;

            color: #fff5f9;
        }

        /* MESSAGE */

        .message {

            color: #c9b1be;

            font-family: Georgia, serif;

            font-size: 16px;

            line-height: 1.8;

            margin-bottom: 30px;
        }

        /* COUNTDOWN */

        .countdown-title {

            color: #806b77;

            font-size: 9px;

            letter-spacing: 3px;

            margin-bottom: 14px;

            text-transform: uppercase;
        }

        .countdown {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-bottom: 30px;
        }

        .time-box {

            padding:
                16px 8px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.045);

            border:
                1px solid
                rgba(255,255,255,0.08);
        }

        .number {

            display: block;

            color: #fff;

            font-size: 25px;

            font-weight: bold;

            line-height: 1;

            margin-bottom: 8px;
        }

        .label {

            display: block;

            color: #806b77;

            font-size: 8px;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        /* DATE */

        .date {

            color: #ff8db6;

            font-family: Georgia, serif;

            font-style: italic;

            font-size: 15px;

            margin-bottom: 25px;
        }

        /* BUTTON */

        .button {

            display: inline-block;

            padding:
                13px 25px;

            border-radius: 30px;

            text-decoration: none;

            color: #c9aab9;

            border:
                1px solid
                rgba(255,255,255,0.12);

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 2px;

            transition:
                0.25s ease;
        }

        .button:hover {

            transform:
                translateY(-2px);

            color: white;

            border-color:
                rgba(255,255,255,0.25);
        }

        /* FOOTER */

        .footer {

            margin-top: 25px;

            color: #604b59;

            font-size: 9px;

            letter-spacing: 2px;
        }

        /* ANIMATION */

        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {

                padding:
                    16px;
            }

            .container {

                padding:
                    38px 20px;

                border-radius: 23px;
            }

            .heart {

                width: 68px;

                height: 68px;

                font-size: 27px;
            }

            .message {

                font-size: 15px;
            }

            .countdown {

                gap: 7px;
            }

            .time-box {

                padding:
                    14px 5px;

                border-radius: 13px;
            }

            .number {

                font-size: 21px;
            }

            .label {

                font-size: 7px;
            }

        }

    </style>

</head>

<body>

    <div class="background">

        <div class="glow one"></div>

        <div class="glow two"></div>

    </div>

    <div class="container">

        <div class="heart">

            ❤️

        </div>

        <div class="eyebrow">

            JUST A LITTLE PATIENCE

        </div>

        <h1>

            Almost time, Aderonke.

        </h1>

        <div class="message">

            Your surprise is waiting for you.

            <br>

            But I don't want you opening
            everything at once. ❤️

        </div>

        <div class="countdown-title">

            YOUR SURPRISE BEGINS IN

        </div>

        <div class="countdown">

            <div class="time-box">

                <span
                    class="number"
                    id="days"
                >
                    00
                </span>

                <span class="label">
                    Days
                </span>

            </div>

            <div class="time-box">

                <span
                    class="number"
                    id="hours"
                >
                    00
                </span>

                <span class="label">
                    Hours
                </span>

            </div>

            <div class="time-box">

                <span
                    class="number"
                    id="minutes"
                >
                    00
                </span>

                <span class="label">
                    Minutes
                </span>

            </div>

            <div class="time-box">

                <span
                    class="number"
                    id="seconds"
                >
                    00
                </span>

                <span class="label">
                    Seconds
                </span>

            </div>

        </div>

        <div class="date">

            September 20, 2026 • ❤️

        </div>

        <a
            href="/"
            class="button"
        >

            ← GO BACK HOME

        </a>

        <div class="footer">

            SOME THINGS ARE WORTH WAITING FOR

        </div>

    </div>

    <script>

        /*
         * SURPRISE START DATE
         *
         * September 20, 2026
         *
         * The countdown uses the visitor's
         * own device time.
         */

        const targetDate =
            new Date(
                "September 20, 2026 00:00:00"
            ).getTime();

        function updateCountdown() {

            const now =
                new Date().getTime();

            const difference =
                targetDate - now;

            /*
             * If the countdown reaches zero,
             * reload the page.
             */

            if (difference <= 0) {

                document.getElementById(
                    "days"
                ).textContent = "00";

                document.getElementById(
                    "hours"
                ).textContent = "00";

                document.getElementById(
                    "minutes"
                ).textContent = "00";

                document.getElementById(
                    "seconds"
                ).textContent = "00";

                return;
            }

            const days =
                Math.floor(
                    difference /
                    (1000 * 60 * 60 * 24)
                );

            const hours =
                Math.floor(
                    (difference %
                    (1000 * 60 * 60 * 24)) /
                    (1000 * 60 * 60)
                );

            const minutes =
                Math.floor(
                    (difference %
                    (1000 * 60 * 60)) /
                    (1000 * 60)
                );

            const seconds =
                Math.floor(
                    (difference %
                    (1000 * 60)) /
                    1000
                );

            document.getElementById(
                "days"
            ).textContent =
                String(days).padStart(2, "0");

            document.getElementById(
                "hours"
            ).textContent =
                String(hours).padStart(2, "0");

            document.getElementById(
                "minutes"
            ).textContent =
                String(minutes).padStart(2, "0");

            document.getElementById(
                "seconds"
            ).textContent =
                String(seconds).padStart(2, "0");

        }

        updateCountdown();

        setInterval(
            updateCountdown,
            1000
        );

    </script>

</body>

</html>
